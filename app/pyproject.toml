[project]
name = "bazaar"
version = "0.1.0"
description = "Merchant stack for agentic commerce - Razorpay buildathon Track 01"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "playwright>=1.62.0",
    "mcp>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false
